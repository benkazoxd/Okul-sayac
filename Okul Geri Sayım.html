<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Okul Geri Sayım</title>
<style>
:root{--g1:#fde68a;--g2:#fbcfe8;--g3:#c4b5fd;--card:rgba(255,255,255,.72);--text:#1e1b4b;--muted:#6b6b85;--a1:#7c3aed;--a2:#ec4899;--line:rgba(30,27,75,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#1e1b4b;--g2:#3b0764;--g3:#0f172a;--card:rgba(30,27,75,.6);--text:#f5f3ff;--muted:#b4b2cc;--a1:#a78bfa;--a2:#f472b6;--line:rgba(255,255,255,.18)}}
:root[data-theme="dark"]{--g1:#1e1b4b;--g2:#3b0764;--g3:#0f172a;--card:rgba(30,27,75,.6);--text:#f5f3ff;--muted:#b4b2cc;--a1:#a78bfa;--a2:#f472b6;--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));background-size:300% 300%;animation:bg 14s ease infinite;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.f{position:absolute;font-size:2rem;opacity:.5;animation:float 9s ease-in-out infinite;pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-28px) rotate(8deg)}}
.card{position:relative;z-index:1;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:32px;padding:30px 24px 24px;text-align:center;width:min(90%,400px);box-shadow:0 20px 60px rgba(76,29,149,.25)}
.status{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:10px}
.badge{display:inline-block;padding:6px 14px;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff;font-size:.85rem;font-weight:700}
.num{font-size:7.5rem;font-weight:900;line-height:1.05;margin:14px 0 0;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.unit{font-size:1.6rem;font-weight:800;margin-top:2px}
.weeks{color:var(--muted);margin:8px 0 20px;font-size:.95rem;min-height:1.2em}
.divider{height:1px;background:var(--line);margin:0 0 16px}
.row{display:flex;gap:10px}
.row div{flex:1}
label{display:block;color:var(--muted);font-size:.75rem;margin-bottom:6px}
input{font:inherit;font-size:.9rem;width:100%;padding:10px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);text-align:center}
input:focus{outline:2px solid var(--a1)}
.btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;font:inherit;font-size:.85rem;font-weight:700;padding:12px 8px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.on{background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.num.msg{font-size:4.5rem}
</style>
</head>
<body>
<span class="f" style="left:8%;top:12%">📚</span>
<span class="f" style="right:10%;top:18%;animation-delay:-2s">✏️</span>
<span class="f" style="left:12%;bottom:14%;animation-delay:-4s">🎒</span>
<span class="f" style="right:8%;bottom:10%;animation-delay:-6s">🔔</span>
<div class="card">
  <div class="status" id="status"></div>
  <span class="badge" id="badge">–</span>
  <div class="num" id="num">–</div>
  <div class="unit" id="unit">gün kaldı</div>
  <div class="weeks" id="weeks"></div>
  <div class="divider"></div>
  <div class="btns">
    <button class="btn" id="bOpen">🎒 Açılmasına kalan</button>
    <button class="btn" id="bClose">🏖️ Kapanmasına kalan</button>
  </div>
</div>
<script>
// MEB resmi takvimi: [açılış, kapanış]. Yeni yıl yayımlanınca buraya eklenebilir.
var TERMS=[["2026-09-14","2027-06-25"]];
var $=function(i){return document.getElementById(i)};
var num=$("num"),unit=$("unit"),weeks=$("weeks"),badge=$("badge"),status=$("status"),bOpen=$("bOpen"),bClose=$("bClose");
function parse(v){var p=v.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
var day=86400000,mode=null,last=null;
function info(){
  var t=new Date();t.setHours(0,0,0,0);
  var i,o,c;
  for(i=0;i<TERMS.length;i++){
    o=parse(TERMS[i][0]);c=parse(TERMS[i][1]);
    if(t<o)return{isOpen:false,d:Math.round((o-t)/day),est:false};
    if(t<c)return{isOpen:true,d:Math.round((c-t)/day),est:false};
  }
  o=parse(TERMS[TERMS.length-1][0]);
  var n=new Date(o.getFullYear()+1,o.getMonth(),o.getDate());
  return{isOpen:false,d:Math.round((n-t)/day),est:true};
}
function weeksText(d,soon){return d>=7?"yaklaşık "+Math.round(d/7)+" hafta":soon}
function show(txt,isMsg,u,b,w){
  if(txt!==last){num.style.animation="none";void num.offsetWidth;num.style.animation="";last=txt}
  num.textContent=txt;num.className="num"+(isMsg?" msg":"");unit.textContent=u;badge.textContent=b;weeks.textContent=w;
}
function update(){
  var x=info();
  status.textContent=x.isOpen?"📖 Okul şu an açık":"🏖️ Okul şu an kapalı";
  if(mode===null)mode=x.isOpen?"close":"open";
  bOpen.className="btn"+(mode==="open"?" on":"");
  bClose.className="btn"+(mode==="close"?" on":"");
  if(mode==="open"){
    if(x.isOpen)show("📖",true,"Okul zaten açık","🎒 Okulun açılmasına","Kapanmasına kalan süre için diğer tuşa bas");
    else show(x.d,false,"gün kaldı","🎒 Okulun açılmasına",x.est?"yeni takvim açıklanınca kesinleşecek (tahmini)":weeksText(x.d,"neredeyse geldi!"));
  }else{
    if(!x.isOpen)show("🏖️",true,"Okul zaten kapalı","🏖️ Okulun kapanmasına","Açılmasına kalan süre için diğer tuşa bas");
    else show(x.d,false,"gün kaldı","🏖️ Okulun kapanmasına",weeksText(x.d,"tatile az kaldı!"));
  }
}
bOpen.addEventListener("click",function(){mode="open";update()});
bClose.addEventListener("click",function(){mode="close";update()});
update();setInterval(update,60000);
</script>
</body>
</html>
